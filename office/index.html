<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Sonneblom AI Works · the office</title>
<link rel="stylesheet" href="office.css?v=8">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <div class="card">
    <div class="logo">SONNEBLOM <b>AI WORKS</b></div>
    <h1>Meet the team</h1>
    <p>Five AI employees at work. Walk up to anyone and tap them to see what they do.</p>
    <p class="keys"><b>Phone:</b> walk with the left joystick, drag to look around.<br><b>Computer:</b> WASD to walk, drag to look, click a bot.</p>
    <button id="enter">Enter the office</button>
  </div>
</div>

<div id="hud">
  <button id="exitBtn" title="Leave the office">← Exit</button>
  <div class="tag">SONNEBLOM <b>AI WORKS</b></div>
</div>
<div id="prompt"><button id="act">⚡ <span></span></button></div>
<div id="joy"><div id="knob"></div></div>
<div id="toast"></div>

<div id="panel" hidden>
  <button id="close" aria-label="Close">✕</button>
  <div id="pbody"></div>
</div>

<script type="module" src="office.js?v=10"></script>
<script src="/assets/sd-track.js" defer></script>
</body>
</html>
